<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi Internal</title>
    
    <!-- Import Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Import FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === VARIABEL TEMA LIGHT (DEFAULT) === */
        :root[data-theme="light"] {
            --bg-gradient: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            --container-bg: rgba(255, 255, 255, 0.85);
            --container-border: rgba(255, 255, 255, 0.4);
            --container-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
            --card-bg: #ffffff;
            --card-text: #2c3e50;
            --card-shadow: 0 8px 22px rgba(0, 0, 0, 0.05);
            --title-color: #2c3e50;
            --desc-color: #7f8c8d;
            --toggle-bg: #ffffff;
            --toggle-text: #2c3e50;
            --toggle-border: rgba(0, 0, 0, 0.1);
        }

        /* === VARIABEL TEMA DARK === */
        :root[data-theme="dark"] {
            --bg-gradient: linear-gradient(-45deg, #090d16, #1a1636, #0d2238, #0b1a20);
            --container-bg: rgba(16, 22, 36, 0.85);
            --container-border: rgba(255, 255, 255, 0.1);
            --container-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            --card-bg: #182032;
            --card-text: #f1f5f9;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --title-color: #f8fafc;
            --desc-color: #94a3b8;
            --toggle-bg: #222d44;
            --toggle-text: #f8fafc;
            --toggle-border: rgba(255, 255, 255, 0.15);
        }

        /* Warna Aksen Aplikasi */
        :root {
            --primary-blue: #3498db;
            --primary-green: #2ecc71;
            --primary-purple: #9b59b6;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animasi untuk Background Gradient */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Tombol Toggle Tema di Pojok Atas */
        .theme-switch {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--toggle-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            font-size: 17px;
            z-index: 99;
            transition: transform 0.25s ease, background 0.3s ease;
        }

        .theme-switch:hover {
            transform: scale(1.1) rotate(15deg);
        }

        /* Glassmorphism Container */
        .container {
            text-align: center;
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 55px 45px;
            border-radius: 24px;
            border: 1px solid var(--container-border);
            box-shadow: var(--container-shadow);
            max-width: 840px; /* Pas untuk 3 kartu berjejer */
            width: 95%;
            transform: translateY(20px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            position: relative;
        }

        /* Animasi Muncul Container */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--title-color);
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--desc-color);
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .app-links {
            display: flex;
            gap: 22px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Styling Kartu Aplikasi */
        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            background: var(--card-bg);
            color: var(--card-text);
            text-decoration: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 220px;
            box-sizing: border-box;
            border: 2px solid transparent;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        .app-card i {
            font-size: 40px;
            margin-bottom: 16px;
            transition: transform 0.3s ease;
        }

        /* Efek Hover: ANGGARAN (Biru) */
        .app-card.anggaran i {
            color: var(--primary-blue);
        }
        .app-card.anggaran:hover {
            border-color: var(--primary-blue);
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 16px 28px rgba(52, 152, 219, 0.25);
        }

        /* Efek Hover: ASISTENSI (Hijau) */
        .app-card.asistensi i {
            color: var(--primary-green);
        }
        .app-card.asistensi:hover {
            border-color: var(--primary-green);
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 16px 28px rgba(46, 204, 113, 0.25);
        }

        /* Efek Hover: SIPD (Ungu) */
        .app-card.sipd i {
            color: var(--primary-purple);
        }
        .app-card.sipd:hover {
            border-color: var(--primary-purple);
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 16px 28px rgba(155, 89, 182, 0.25);
        }

        .app-card:hover i {
            transform: scale(1.12);
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 650px) {
            .container {
                padding: 40px 24px;
            }
            .app-card {
                width: 100%;
                padding: 20px 22px;
                flex-direction: row;
                justify-content: flex-start;
                gap: 20px;
            }
            .app-card i {
                margin-bottom: 0;
                font-size: 32px;
            }
            .theme-switch {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Tombol Dark / Light Mode -->
    <button class="theme-switch" id="themeBtn" title="Ganti Mode Terang / Gelap">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>

    <div class="container">
        <h1>Portal Aplikasi Internal</h1>
        <p>Selamat datang! Silakan pilih aplikasi yang ingin Anda akses hari ini.</p>
        
        <div class="app-links">
            <!-- 1. BKAD Anggaran -->
            <a href="/BKAD-ANGGARAN/public/" class="app-card anggaran">
                <i class="fa-solid fa-chart-pie"></i>
                <span>ANGGARAN</span>
            </a>
            
            <!-- 2. Asistensi RKA -->
            <a href="/asistensi-rka/public/" class="app-card asistensi">
                <i class="fa-solid fa-file-signature"></i>
                <span>Asistensi RKA</span>
            </a>

            <!-- 3. SIPD Penganggaran -->
            <a href="/sipd-local/public/" class="app-card sipd">
                <i class="fa-solid fa-layer-group"></i>
                <span>SIPD Penganggaran</span>
            </a>
        </div>
    </div>

    <!-- Script Saklar Light & Dark Mode -->
    <script>
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('user-portal-theme', theme);
            if (theme === 'dark') {
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                themeIcon.className = 'fa-solid fa-moon';
            }
        }

        // Baca preferensi yang tersimpan atau default ke Light
        const savedTheme = localStorage.getItem('user-portal-theme') || 'light';
        setTheme(savedTheme);

        themeBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            setTheme(current === 'light' ? 'dark' : 'light');
        });
    </script>
</body>
</html>
